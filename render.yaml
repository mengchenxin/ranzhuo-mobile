services:
  - type: web
    name: ranzhuo-mobile
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: RANZHUO_ALLOWED_ORIGINS
        sync: false
      - key: RANZHUO_RATE_LIMIT_PER_10_MIN
        value: "30"
      - key: RANZHUO_REQUIRE_CLIENT_KEY
        value: "true"
